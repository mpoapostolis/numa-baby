      <p>
        Baby Tracker is a free baby-logging app for tired parents. Record feeds, diaper
        changes, burping, growth and gentle health notes with one hand. It works offline,

        device unless you switch on Family Sync, which stores them in your family's own
        space so a second phone can share the log. JavaScript is required to use the app.
