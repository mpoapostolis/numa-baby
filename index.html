    <!--
      What a reader without JavaScript gets — which, as of 2026, is every AI
      assistant's crawler: GPTBot, ClaudeBot, PerplexityBot and the rest fetch
      pages but do not run them. Without this the home page is a spinner and a
      div to them, while the twelve pages of real sourced guidance sit one link
      away, unlinked from the only page they will ever fetch. Everything below
      is true of the app and reachable from it; nothing here is written for a
      crawler that a person would not also be told.
    -->
    <noscript>
      <h1>Numalog — free, private baby tracker for newborns</h1>
      <p>
        Record feeds, nappy changes, burping, sleep and growth with one hand. No account,
        works offline, and your entries stay on your device unless you switch on Family
        Sync, which shares the log with a second phone. JavaScript is required to run the
        tracker itself — the guidance below is plain pages that need none.
      </p>

      <p>
