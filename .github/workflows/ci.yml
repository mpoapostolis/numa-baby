# Every safety net the repository has — the app and worker typecheck, the
# lint, 325 unit tests, the production build, the prerendered pages and the
# bundle-size budgets — used to run only when somebody remembered to run
# them before `npm run deploy`. Now they run on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The build starts with the app and worker typecheck.
      - run: npm run build
      - run: npm run test:build
      # The Worker bundles and its config parses, without touching the
      # deployed one. Needs no secrets.
      - run: npx wrangler deploy --dry-run --outdir=.wrangler/dry-run
